<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Account - Travault</title>

    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Custom styles to use the Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Simple transition for a smoother UI */
        .transition-all {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Main Container -->
    <div class="container mx-auto max-w-2xl px-4 py-8 sm:py-12 md:py-16">

        <!-- Header Section -->
        <header class="text-center mb-10 md:mb-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-blue-600">Travault</h1>
            <p class="text-lg text-gray-500 mt-2">Account Deletion Request</p>
        </header>

        <!-- Main Content Card -->
        <main id="form-container" class="bg-white p-6 sm:p-8 md:p-10 rounded-2xl shadow-sm border border-gray-200">
            <div class="text-center">
                <h2 class="text-xl sm:text-2xl font-semibold text-gray-900">We're Sorry to See You Go</h2>
                <p class="mt-2 text-gray-600">Please fill out this form to request the permanent deletion of your
                    account and all associated data. This action cannot be undone.</p>
            </div>

            <!-- Deletion Request Form -->
            <form id="delete-form" class="mt-8 space-y-6" novalidate>
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <!-- User ID Field (Optional) -->
                <div>
                    <label for="userid" class="block text-sm font-medium text-gray-700">User ID <span
                            class="text-gray-400 font-normal">(Optional)</span></label>
                    <input type="text" id="userid" name="userid"
                        class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <!-- Reason Field (Optional) -->
                <div>
                    <label for="reason" class="block text-sm font-medium text-gray-700">Reason for leaving <span
                            class="text-gray-400 font-normal">(Optional)</span></label>
                    <textarea id="reason" name="reason" rows="4"
                        class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"></textarea>
                </div>

                <!-- Confirmation Checkbox -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="confirmation" name="confirmation" type="checkbox" required
                            class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="confirmation" class="font-medium text-gray-700">I understand that this action is
                            permanent and will delete all my data, including saved spots and plans.</label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" id="submit-btn"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all disabled:bg-gray-400 disabled:cursor-not-allowed">
                        Request Account Deletion
                    </button>
                </div>
            </form>

            <!-- Success/Error Message Area -->
            <div id="message-area" class="hidden mt-6 text-center p-4 rounded-lg"></div>

        </main>

        <!-- Footer -->
        <footer class="text-center mt-10 md:mt-12">
            <p class="text-sm text-gray-400">&copy; 2025 Travault. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // --- Form Submission Logic ---
        const form = document.getElementById('delete-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageArea = document.getElementById('message-area');
        const formContainer = document.getElementById('form-container');

        form.addEventListener('submit', function (event) {
            // Prevent the default form submission which reloads the page
            event.preventDefault();

            // --- Basic Validation ---
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const confirmation = document.getElementById('confirmation').checked;

            if (!name || !email || !confirmation) {
                showMessage('Please fill out all required fields and confirm the deletion.', 'error');
                return;
            }

            // --- Handle Form Submission (Visual Feedback) ---
            // In a real application, you would send this data to your server here.
            // For example: using fetch() to POST to your API endpoint.

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            // Simulate a network request
            setTimeout(() => {
                // Show a success message and hide the form
                form.classList.add('hidden');
                formContainer.innerHTML = `
                    <div class="text-center">
                        <svg class="mx-auto h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <h2 class="mt-4 text-xl sm:text-2xl font-semibold text-gray-900">Request Received</h2>
                        <p class="mt-2 text-gray-600">Thank you. We have received your account deletion request. It will be processed within 7 business days. You will receive a final confirmation email once your data has been permanently erased.</p>
                    </div>
                `;
            }, 1500);
        });

        function showMessage(message, type) {
            messageArea.textContent = message;
            messageArea.className = 'mt-6 text-center p-4 rounded-lg'; // Reset classes
            if (type === 'error') {
                messageArea.classList.add('bg-red-100', 'text-red-700');
            }
            messageArea.classList.remove('hidden');
        }
    </script>

</body>

</html>
